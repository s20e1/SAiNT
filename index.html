<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAiNT - 스마트 보건 차트 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            letter-spacing: -0.02em;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast-animate {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-200">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Global Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-950/40 backdrop-blur-xs z-50 flex items-center justify-center hidden">
        <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-xl flex items-center space-x-3 border border-slate-200 dark:border-slate-800">
            <div class="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
            <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">처리 중입니다...</span>
        </div>
    </div>

    <!-- Firebase SDK Imports & Configuration Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc, 
            onSnapshot, 
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.appState = {
            user: null,
            db: null,
            auth: null,
            appId: 'saint-health-saints021011',
            records: [],
            inventory: [],
            members: [],
            currentTab: 'logs',
            searchQuery: '',
            memberSearchQuery: '',
            filterCategory: 'all',
            selectedKitFilter: 'all',
            isDarkMode: false,
            inventoryInitialized: false,
            membersInitialized: false
        };

        const firebaseConfig = {
            apiKey: "AIzaSyDeRYQvFTL4l0KciQ1znIxO6dKPLdsdzpU",
            authDomain: "saints021011.firebaseapp.com",
            projectId: "saints021011",
            storageBucket: "saints021011.firebasestorage.app",
            messagingSenderId: "900966825477",
            appId: "1:900966825477:web:0d5878d6f78318e1b2a66c",
            measurementId: "G-RD9MVZSKKH"
        };

        try {
            const app = initializeApp(firebaseConfig);
            window.appState.auth = getAuth(app);
            window.appState.db = getFirestore(app);

            onAuthStateChanged(window.appState.auth, (user) => {
                if (user) {
                    window.appState.user = user;
                    const displayElem = document.getElementById('user-email-display');
                    if (displayElem) displayElem.innerText = user.email || user.displayName || '구글 로그인 사용자';
                    const loginModal = document.getElementById('login-modal');
                    if (loginModal) loginModal.classList.add('hidden');
                    initDataListeners();
                } else {
                    window.appState.user = null;
                    window.appState.inventoryInitialized = false;
                    window.appState.membersInitialized = false;
                    const loginModal = document.getElementById('login-modal');
                    if (loginModal) loginModal.classList.remove('hidden');
                }
            });
        } catch (e) {
            console.warn("Firebase 연결 오류 또는 폴백 모드 활성화:", e);
            const loginModal = document.getElementById('login-modal');
            if (loginModal) loginModal.classList.remove('hidden');
        }

        // Auth Actions
        window.handleLoginSubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const titleText = document.getElementById('auth-mode-title').innerText;
            const isSignUp = titleText.includes('회원가입');

            showLoading(true);
            try {
                if (window.appState.auth) {
                    if (isSignUp) {
                        await createUserWithEmailAndPassword(window.appState.auth, email, password);
                        showToast('회원가입이 완료되었습니다.', 'success');
                    } else {
                        await signInWithEmailAndPassword(window.appState.auth, email, password);
                        showToast('로그인되었습니다.', 'success');
                    }
                } else {
                    window.appState.user = { uid: 'local-user', email };
                    document.getElementById('user-email-display').innerText = email;
                    document.getElementById('login-modal').classList.add('hidden');
                    loadEmptyData();
                    showToast('로컬 모드로 접속되었습니다.', 'success');
                }
            } catch (err) {
                showToast("인증 오류: " + err.message, 'error');
            } finally {
                showLoading(false);
            }
        };

        window.handleGoogleLogin = async () => {
            showLoading(true);
            try {
                if (window.appState.auth) {
                    const provider = new GoogleAuthProvider();
                    await signInWithPopup(window.appState.auth, provider);
                    showToast('구글 계정으로 로그인되었습니다.', 'success');
                } else {
                    window.appState.user = { uid: 'google-mock', email: 'google.user@gmail.com' };
                    document.getElementById('user-email-display').innerText = '구글 로그인 사용자';
                    document.getElementById('login-modal').classList.add('hidden');
                    loadEmptyData();
                    showToast('구글 계정으로 로그인되었습니다.', 'success');
                }
            } catch (err) {
                showToast("구글 로그인 실패: " + err.message, 'error');
            } finally {
                showLoading(false);
            }
        };

        window.toggleAuthMode = () => {
            const title = document.getElementById('auth-mode-title');
            const btn = document.getElementById('auth-submit-btn');
            const switchText = document.getElementById('auth-switch-text');
            if (title.innerText.includes('로그인')) {
                title.innerText = 'SAiNT 회원가입';
                btn.innerText = '가입하기';
                switchText.innerHTML = '이미 계정이 있으신가요? <button type="button" onclick="toggleAuthMode()" class="underline font-semibold text-slate-900 dark:text-white">로그인</button>';
            } else {
                title.innerText = 'SAiNT 로그인';
                btn.innerText = '로그인';
                switchText.innerHTML = '계정이 없으신가요? <button type="button" onclick="toggleAuthMode()" class="underline font-semibold text-slate-900 dark:text-white">회원가입</button>';
            }
        };

        window.handleLogout = async () => {
            if (window.appState.auth) {
                await signOut(window.appState.auth);
            }
            window.appState.user = null;
            window.appState.inventoryInitialized = false;
            window.appState.membersInitialized = false;
            document.getElementById('login-modal').classList.remove('hidden');
            showToast('로그아웃되었습니다.', 'info');
        };

        function initDataListeners() {
            if (!window.appState.user || !window.appState.db) {
                loadEmptyData();
                return;
            }

            const uid = window.appState.user.uid;
            const appId = window.appState.appId;

            // Health Logs Realtime Listener
            const logsRef = collection(window.appState.db, 'artifacts', appId, 'users', uid, 'health_logs');
            onSnapshot(logsRef, (snapshot) => {
                const logs = [];
                snapshot.forEach(docSnap => {
                    logs.push({ id: docSnap.id, ...docSnap.data() });
                });
                window.appState.records = logs.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                renderApp();
            }, (err) => { console.error("Logs Snapshot Error:", err); });

            // Inventory Realtime Listener
            const invRef = collection(window.appState.db, 'artifacts', appId, 'users', uid, 'inventory');
            onSnapshot(invRef, async (snapshot) => {
                const inv = [];
                snapshot.forEach(docSnap => {
                    inv.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (snapshot.empty && !window.appState.inventoryInitialized) {
                    window.appState.inventoryInitialized = true;
                    const defaultItems = getDefaultInventory();
                    window.appState.inventory = defaultItems;
                    for (const item of defaultItems) {
                        try {
                            await setDoc(doc(window.appState.db, 'artifacts', appId, 'users', uid, 'inventory', item.id), item);
                        } catch(e) { console.error(e); }
                    }
                } else {
                    window.appState.inventoryInitialized = true;
                    window.appState.inventory = inv;
                }
                renderApp();
            }, (err) => { console.error("Inventory Snapshot Error:", err); });

            // Members Realtime Listener
            const membersRef = collection(window.appState.db, 'artifacts', appId, 'users', uid, 'members');
            onSnapshot(membersRef, async (snapshot) => {
                const mems = [];
                snapshot.forEach(docSnap => {
                    mems.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (snapshot.empty && !window.appState.membersInitialized) {
                    window.appState.membersInitialized = true;
                    const defaultMems = getDefaultMembers();
                    window.appState.members = defaultMems;
                    for (const mem of defaultMems) {
                        try {
                            await setDoc(doc(window.appState.db, 'artifacts', appId, 'users', uid, 'members', mem.id), mem);
                        } catch(e) { console.error(e); }
                    }
                } else {
                    window.appState.membersInitialized = true;
                    window.appState.members = mems;
                }
                renderApp();
            }, (err) => { console.error("Members Snapshot Error:", err); });
        }

        function getDefaultInventory() {
            return [
                { id: 'inv-1', kit: '포터블 구급가방', name: '혼합 대일밴드', category: '드레싱', type: 'consumable', count: 30, minCount: 10, unit: '개' },
                { id: 'inv-2', kit: '포터블 구급가방', name: '소독용 포비돈 면봉', category: '소독액', type: 'consumable', count: 15, minCount: 5, unit: '개' },
                { id: 'inv-3', kit: '포터블 구급가방', name: '멸균 가제 (7.5cm)', category: '드레싱', type: 'consumable', count: 20, minCount: 5, unit: '팩' },
                { id: 'inv-4', kit: '특수 구급가방', name: '탄력 압박붕대', category: '고정용품', type: 'consumable', count: 4, minCount: 2, unit: '개' },
                { id: 'inv-5', kit: '특수 구급가방', name: '휴대용 산소포화도 측정기', category: '장비', type: 'non-consumable', count: 1, minCount: 1, unit: '대' },
                { id: 'inv-6', kit: '특수 구급가방', name: '자동제세동기(AED) 패드', category: '응급장비', type: 'consumable', count: 2, minCount: 1, unit: '세트' }
            ];
        }

        function getDefaultMembers() {
            return [
                { id: 'mem-1', name: '홍길동', group: '1팀 / A그룹', notes: '특이사항 없음' },
                { id: 'mem-2', name: '김철수', group: '2팀 / B그룹', notes: '페니실린 알레르기 주의' }
            ];
        }

        function loadEmptyData() {
            window.appState.records = [];
            window.appState.inventory = [];
            window.appState.members = [];
            renderApp();
        }
    </script>

    <!-- UI Container -->
    <div id="app" class="max-w-4xl mx-auto px-4 py-6 md:px-8">

        <!-- Header -->
        <header class="flex items-center justify-between pb-6 mb-6 border-b border-slate-200 dark:border-slate-800">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center p-1.5 shadow-sm border border-slate-200/60 dark:border-slate-700/60 overflow-hidden">
                    <img src="image.png" alt="SAiNT Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                        SAiNT
                        <span class="text-xs font-normal px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300">스마트 보건 시스템</span>
                    </h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">명단 관리 및 소모품 연동 보건 차트 솔루션</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="toggleDarkMode()" class="p-2.5 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i id="dark-icon" class="fa-solid fa-moon text-base"></i>
                </button>
                <div class="hidden md:flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-3 py-2 rounded-xl">
                    <span id="user-email-display">게스트</span>
                    <button onclick="handleLogout()" class="text-rose-500 hover:underline ml-1 font-semibold">로그아웃</button>
                </div>
                <button onclick="openNewRecordModal()" class="bg-slate-900 hover:bg-slate-800 dark:bg-white dark:hover:bg-slate-100 text-white dark:text-slate-900 text-sm font-semibold px-4 py-2.5 rounded-xl shadow-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>차트 기록</span>
                </button>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex space-x-1 mb-6 border-b border-slate-200 dark:border-slate-800 pb-2 overflow-x-auto">
            <button onclick="switchTab('logs')" id="tab-logs" class="tab-btn px-4 py-2 rounded-lg text-sm font-semibold transition text-slate-900 dark:text-white bg-white dark:bg-slate-800 shadow-sm">
                <i class="fa-solid fa-address-book mr-1.5 opacity-70"></i> 통합 처치 차트
            </button>
            <button onclick="switchTab('members')" id="tab-members" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium transition text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white">
                <i class="fa-solid fa-users mr-1.5 opacity-70"></i> 대상자 명단
            </button>
            <button onclick="switchTab('stats')" id="tab-stats" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium transition text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white">
                <i class="fa-solid fa-chart-pie mr-1.5 opacity-70"></i> 통계 분석
            </button>
            <button onclick="switchTab('inventory')" id="tab-inventory" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium transition text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white">
                <i class="fa-solid fa-briefcase-medical mr-1.5 opacity-70"></i> 구급가방 재고
            </button>
        </div>

        <!-- TAB CONTENT: LOGS -->
        <div id="view-logs" class="tab-content space-y-4">
            <div class="bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200/80 dark:border-slate-800 flex flex-col md:flex-row gap-3 items-center justify-between">
                <div class="relative w-full md:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="이름 검색..." class="w-full pl-9 pr-4 py-2 bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-400 transition">
                </div>

                <div class="flex items-center gap-1.5 overflow-x-auto w-full md:w-auto pb-1 md:pb-0">
                    <button onclick="setCategoryFilter('all')" class="cat-filter-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 dark:bg-white text-white dark:text-slate-900">전체</button>
                    <button onclick="setCategoryFilter('외상')" class="cat-filter-btn px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">외상</button>
                    <button onclick="setCategoryFilter('내상')" class="cat-filter-btn px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">내상</button>
                    <button onclick="setCategoryFilter('기타')" class="cat-filter-btn px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">기타</button>
                </div>
            </div>

            <div id="search-notice" class="hidden bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900 p-3 rounded-xl text-xs text-emerald-800 dark:text-emerald-300 flex items-center justify-between">
                <span id="search-notice-text">검색 결과</span>
                <button onclick="clearSearchFilter()" class="underline font-semibold hover:text-emerald-900">전체 목록 보기</button>
            </div>

            <div id="records-list" class="space-y-3"></div>
        </div>

        <!-- TAB CONTENT: MEMBERS -->
        <div id="view-members" class="tab-content hidden space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200/80 dark:border-slate-800">
                <div class="relative w-full sm:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                    <input type="text" id="member-search-input" oninput="handleMemberSearch(this.value)" placeholder="등록된 이름/소속 검색..." class="w-full pl-9 pr-4 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none">
                </div>
                <button onclick="openAddMemberModal()" class="text-xs bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-4 py-2.5 rounded-xl font-semibold transition flex items-center gap-2 justify-center">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>신규 대상자 등록</span>
                </button>
            </div>

            <div id="members-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </div>

        <!-- TAB CONTENT: STATISTICS -->
        <div id="view-stats" class="tab-content hidden space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-xs">
                    <div class="text-xs text-slate-500 dark:text-slate-400 mb-1">총 처치 건수</div>
                    <div class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white" id="stat-total-count">0건</div>
                </div>
                <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-xs">
                    <div class="text-xs text-slate-500 dark:text-slate-400 mb-1">최다 발생 유형</div>
                    <div class="text-xl font-bold tracking-tight text-emerald-600 dark:text-emerald-400 mt-1" id="stat-top-category">-</div>
                </div>
                <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-xs">
                    <div class="text-xs text-slate-500 dark:text-slate-400 mb-1">방문 대상자 수 (중복 제외)</div>
                    <div class="text-3xl font-bold tracking-tight text-indigo-600 dark:text-indigo-400" id="stat-unique-members">0명</div>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200/80 dark:border-slate-800 space-y-5 shadow-xs">
                <h3 class="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-chart-bar text-slate-400"></i>
                    유형별 발생 비율
                </h3>
                <div id="stats-breakdown-list" class="space-y-4 text-xs"></div>
            </div>
        </div>

        <!-- TAB CONTENT: INVENTORY -->
        <div id="view-inventory" class="tab-content hidden space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <h2 class="text-base font-bold text-slate-900 dark:text-white">구급가방 재고 관리</h2>
