<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-200">

    <!-- Toast Notification Container -->

    <!-- Global Loading Overlay -->

        <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-xl flex items-center space-x-3 border border-slate-200 dark:border-slate-800">
            <div class="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
            <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">처리 중입니다...</span>
        </div>
    </div>

    <!-- Firebase SDK Imports & Configuration Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc, 
            onSnapshot, 
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.appState = {
            user: null,
            db: null,
            auth: null,
            appId: 'saint-health-saints021011',
            records: [],
            inventory: [],
            currentTab: 'logs',
            searchQuery: '',
            filterCategory: 'all',
            selectedKitFilter: 'all',
            isDarkMode: false,
            inventoryInitialized: false
        };

        const firebaseConfig = {
            apiKey: "AIzaSyDeRYQvFTL4l0KciQ1znIxO6dKPLdsdzpU",
            authDomain: "saints021011.firebaseapp.com",
            projectId: "saints021011",
            storageBucket: "saints021011.firebasestorage.app",
            messagingSenderId: "900966825477",
            appId: "1:900966825477:web:0d5878d6f78318e1b2a66c",
            measurementId: "G-RD9MVZSKKH"
        };

        try {
            const app = initializeApp(firebaseConfig);
            window.appState.auth = getAuth(app);
            window.appState.db = getFirestore(app);

            onAuthStateChanged(window.appState.auth, (user) => {
                if (user) {
                    window.appState.user = user;
                    const displayElem = document.getElementById('user-email-display');
                    if (displayElem) displayElem.innerText = user.email || user.displayName || '구글 로그인 사용자';
                    const loginModal = document.getElementById('login-modal');
                    if (loginModal) loginModal.classList.add('hidden');
                    initDataListeners();
                } else {
                    window.appState.user = null;
                    window.appState.inventoryInitialized = false;
                    const loginModal = document.getElementById('login-modal');
                    if (loginModal) loginModal.classList.remove('hidden');
                }
            });
        } catch (e) {
            console.warn("Firebase 연결 오류 또는 폴백 모드 활성화:", e);
            const loginModal = document.getElementById('login-modal');
            if (loginModal) loginModal.classList.remove('hidden');
        }

        // Auth Actions
        window.handleLoginSubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const titleText = document.getElementById('auth-mode-title').innerText;
            const isSignUp = titleText.includes('회원가입');

            showLoading(true);
            try {
                if (window.appState.auth) {
                    if (isSignUp) {
                        await createUserWithEmailAndPassword(window.appState.auth, email, password);
                        showToast('성공적으로 회원가입 및 등록되었습니다.', 'success');
                    } else {
                        await signInWithEmailAndPassword(window.appState.auth, email, password);
                        showToast('성공적으로 로그인되었습니다.', 'success');
                    }
                } else {
                    window.appState.user = { uid: 'local-user', email };
                    document.getElementById('user-email-display').innerText = email;
                    document.getElementById('login-modal').classList.add('hidden');
                    loadEmptyData();
                    showToast('로컬 모드로 로그인되었습니다.', 'success');
                }
            } catch (err) {
                showToast("인증 오류: " + err.message, 'error');
            } finally {
                showLoading(false);
            }
        };

        window.handleGoogleLogin = async () => {
            showLoading(true);
            try {
                if (window.appState.auth) {
                    const provider = new GoogleAuthProvider();
                    await signInWithPopup(window.appState.auth, provider);
                    showToast('구글 계정으로 로그인되었습니다.', 'success');
                } else {
                    window.appState.user = { uid: 'google-mock', email: 'google.user@gmail.com' };
                    document.getElementById('user-email-display').innerText = '구글 로그인 사용자';
                    document.getElementById('login-modal').classList.add('hidden');
                    loadEmptyData();
                    showToast('구글 계정으로 로그인되었습니다.', 'success');
                }
            } catch (err) {
                showToast("구글 로그인 실패: " + err.message, 'error');
            } finally {
                showLoading(false);
            }
        };

        window.toggleAuthMode = () => {
            const title = document.getElementById('auth-mode-title');
            const btn = document.getElementById('auth-submit-btn');
            const switchText = document.getElementById('auth-switch-text');
            if (title.innerText.includes('로그인')) {
                title.innerText = 'SAiNT 회원가입';
                btn.innerText = '가입하고 시작하기';
                switchText.innerHTML = '이미 계정이 있으신가요? <button type="button" onclick="toggleAuthMode()" class="underline font-semibold text-slate-900 dark:text-white">로그인</button>';
            } else {
                title.innerText = 'SAiNT 로그인';
                btn.innerText = '로그인';
                switchText.innerHTML = '계정이 없으신가요? <button type="button" onclick="toggleAuthMode()" class="underline font-semibold text-slate-900 dark:text-white">회원가입</button>';
            }
        };

        window.handleLogout = async () => {
            if (window.appState.auth) {
                await signOut(window.appState.auth);
            }
            window.appState.user = null;
            window.appState.inventoryInitialized = false;
            document.getElementById('login-modal').classList.remove('hidden');
            showToast('로그아웃되었습니다.', 'info');
        };

        function initDataListeners() {
            if (!window.appState.user || !window.appState.db) {
                loadEmptyData();
                return;
            }

            const uid = window.appState.user.uid;
            const appId = window.appState.appId;

            // Health Logs Realtime Listener
            const logsRef = collection(window.appState.db, 'artifacts', appId, 'users', uid, 'health_logs');
            onSnapshot(logsRef, (snapshot) => {
                const logs = [];
                snapshot.forEach(docSnap => {
                    logs.push({ id: docSnap.id, ...docSnap.data() });
                });
                window.appState.records = logs.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                renderApp();
            }, (err) => { 
                console.error("Logs Snapshot Error:", err); 
                showToast("DB 권한 오류: Firestore 보안 규칙을 확인하세요.", "error");
            });

            // Inventory Realtime Listener
            const invRef = collection(window.appState.db, 'artifacts', appId, 'users', uid, 'inventory');
            onSnapshot(invRef, async (snapshot) => {
                const inv = [];
                snapshot.forEach(docSnap => {
                    inv.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (snapshot.empty && !window.appState.inventoryInitialized) {
                    window.appState.inventoryInitialized = true;
                    const defaultItems = getDefaultInventory();
                    window.appState.inventory = defaultItems;
                    for (const item of defaultItems) {
                        try {
                            await setDoc(doc(window.appState.db, 'artifacts', appId, 'users', uid, 'inventory', item.id), item);
                        } catch(e) { console.error(e); }
                    }
                } else {
                    window.appState.inventoryInitialized = true;
                    window.appState.inventory = inv;
                }
                renderApp();
            }, (err) => { 
                console.error("Inventory Snapshot Error:", err); 
            });
        }

        function getDefaultInventory() {
            return [
                { id: 'inv-1', kit: '포터블 구급가방', name: '혼합 대일밴드', category: '드레싱', count: 30, minCount: 10, unit: '개' },
                { id: 'inv-2', kit: '포터블 구급가방', name: '소독용 포비돈 면봉', category: '소독액', count: 15, minCount: 5, unit: '개' },
                { id: 'inv-3', kit: '포터블 구급가방', name: '멸균 가제 (7.5cm)', category: '드레싱', count: 20, minCount: 5, unit: '팩' },
                { id: 'inv-4', kit: '특수 구급가방', name: '탄력 압박붕대', category: '고정용품', count: 4, minCount: 2, unit: '개' },
                { id: 'inv-5', kit: '특수 구급가방', name: '휴대용 산소포화도 측정기', category: '장비', count: 1, minCount: 1, unit: '대' },
                { id: 'inv-6', kit: '특수 구급가방', name: '자동제세동기(AED) 패드', category: '응급장비', count: 2, minCount: 1, unit: '세트' }
            ];
        }

        function loadEmptyData() {
            window.appState.records = [];
            window.appState.inventory = [];
            renderApp();
        }
    </script>

    <!-- UI Container -->
    <div id="app" class="max-w-4xl mx-auto px-4 py-6 md:px-8">

        <header class="flex items-center justify-between pb-6 mb-6 border-b border-slate-200 dark:border-slate-800">

        <!-- TAB CONTENT: LOGS -->
        <div id="view-logs" class="tab-content space-y-4">

                    <button onclick="setCategoryFilter('내상')" class="cat-filter-btn px-3.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">내상</button>

                <h3 class="text-base font-bold text-slate-900 dark:text-white">SAiNT 차트 신규 작성</h3>
                <button onclick="closeRecordModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-sm">
                    <i class="fa-solid fa-xmark text-lg"></i>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        // Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-slate-900 text-white dark:bg-white dark:text-slate-900';
            let icon = 'fa-circle-check text-emerald-400';
            
            if (type === 'error') {
                bgClass = 'bg-rose-600 text-white';
                icon = 'fa-circle-exclamation text-white';
            } else if (type === 'info') {
                bgClass = 'bg-sky-600 text-white';
                icon = 'fa-circle-info text-white';
            }

            toast.className = `toast-animate pointer-events-auto flex items-center gap-2 px-4 py-3 rounded-2xl shadow-lg text-xs font-semibold ${bgClass}`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-sm"></i><span>${escapeHtml(message)}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Loading Overlay System
        function showLoading(isLoading) {
            const overlay = document.getElementById('loading-overlay');
            if (isLoading) {
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }

        function renderApp() {
            renderRecords();
            renderStatistics();
            renderInventory();
        }

        function renderRecords() {
            const container = document.getElementById('records-list');
            if (!container) return;
            let items = [...window.appState.records];

            const query = window.appState.searchQuery.toLowerCase().trim();
            const noticeEl = document.getElementById('search-notice');
            const noticeText = document.getElementById('search-notice-text');

            if (query) {
                items = items.filter(r => r.studentName.toLowerCase().includes(query));
                noticeEl.classList.remove('hidden');
                noticeText.innerText = `"${query}" 검색 결과: 총 ${items.length}건의 누적 차트`;
            } else {
                noticeEl.classList.add('hidden');
            }

            if (window.appState.filterCategory !== 'all') {
                items = items.filter(r => r.category === window.appState.filterCategory);
            }

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 text-slate-400">
                        <i class="fa-solid fa-folder-open text-2xl mb-2"></i>
                        <p class="text-xs">저장된 차트 기록이 없습니다.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map(record => {
                const dateObj = new Date(record.timestamp);
                const timeStr = dateObj.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
                const dateStr = dateObj.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });

                return `
                    <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-xs transition hover:border-slate-300 dark:hover:border-slate-700">
                        <div class="flex items-start justify-between">
                            <div class="flex items-center space-x-2.5 flex-wrap gap-y-1">
                                <button onclick="searchStudent('${escapeHtml(record.studentName)}')" class="font-bold text-sm text-slate-900 dark:text-white hover:underline flex items-center gap-1 group">
                                    <span>${escapeHtml(record.studentName)}</span>
                                    <i class="fa-solid fa-search text-[10px] text-slate-400 group-hover:text-slate-600"></i>
                                </button>
                                ${record.gradeClass ? `<span class="text-xs text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-md">${escapeHtml(record.gradeClass)}</span>` : ''}
                                <span class="text-xs px-2 py-0.5 rounded-md ${getCategoryBadge(record.category)}">${escapeHtml(record.category)}</span>
                                ${record.kit ? `<span class="text-[11px] px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300 font-medium">${escapeHtml(record.kit)}</span>` : ''}
                            </div>
                            <button onclick="deleteRecord('${record.id}')" class="p-1 text-slate-400 hover:text-rose-500 transition">
                                <i class="fa-regular fa-trash-can"></i>
                            </button>
                        </div>

                        <div class="mt-3 space-y-1 text-xs">
                            <div class="text-slate-700 dark:text-slate-300"><span class="font-semibold text-slate-900 dark:text-slate-100">증상:</span> ${escapeHtml(record.symptom)}</div>
                            <div class="text-slate-600 dark:text-slate-400"><span class="font-semibold text-slate-800 dark:text-slate-200">처치:</span> ${escapeHtml(record.treatment)}</div>
                        </div>

                        <div class="mt-3 pt-2.5 border-t border-slate-100 dark:border-slate-800/60 flex items-center justify-between text-[11px] text-slate-400">
                            <div class="flex items-center gap-3 flex-wrap">
                                ${record.temp ? `<span><i class="fa-solid fa-thermometer-half mr-1 text-rose-400"></i>${record.temp}℃</span>` : ''}
                                ${record.bp ? `<span><i class="fa-solid fa-heart-pulse mr-1 text-indigo-400"></i>${record.bp}</span>` : ''}
                                ${record.spo2 ? `<span><i class="fa-solid fa-lungs mr-1 text-sky-400"></i>SpO2 ${record.spo2}%</span>` : ''}
                                ${record.hr ? `<span><i class="fa-solid fa-wave-square mr-1 text-emerald-400"></i>${record.hr}bpm</span>` : ''}
                            </div>
                            <div>${dateStr} ${timeStr}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderStatistics() {
            const records = window.appState.records;
            const totalCount = records.length;
            const totalEl = document.getElementById('stat-total-count');
            if (totalEl) totalEl.innerText = `${totalCount}건`;

            const uniqueStudents = new Set(records.map(r => r.studentName.trim())).size;
            const uniqueEl = document.getElementById('stat-unique-students');
            if (uniqueEl) uniqueEl.innerText = `${uniqueStudents}명`;

            const categories = ['외상', '내상', '기타'];
            const counts = {};
            categories.forEach(cat => counts[cat] = 0);

            records.forEach(r => {
                if (counts[r.category] !== undefined) counts[r.category]++;
                else counts['기타'] = (counts['기타'] || 0) + 1;
            });

            let topCat = '-';
            let maxVal = -1;
            for (const [cat, val] of Object.entries(counts)) {
                if (val > maxVal) { maxVal = val; topCat = cat; }
            }
            const topEl = document.getElementById('stat-top-category');
            if (topEl) topEl.innerText = maxVal > 0 ? `${topCat} (${maxVal}건)` : '데이터 없음';

            const breakdownContainer = document.getElementById('stats-breakdown-list');
            if (!breakdownContainer) return;

            if (totalCount === 0) {
                breakdownContainer.innerHTML = `<p class="text-slate-400 text-center py-4">집계할 데이터가 없습니다.</p>`;
                return;
            }

            breakdownContainer.innerHTML = categories.map(cat => {
                const count = counts[cat];
                const percent = Math.round((count / totalCount) * 100);
                return `
                    <div>
                        <div class="flex justify-between font-semibold text-slate-700 dark:text-slate-300 mb-1">
                            <span>${cat}</span><span>${count}건 (${percent}%)</span>
                        </div>
                        <div class="w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
                            <div class="bg-slate-900 dark:bg-white h-full rounded-full transition-all duration-500" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderInventory() {
            const body = document.getElementById('inventory-table-body');
            if (!body) return;
            let items = [...window.appState.inventory];

            if (window.appState.selectedKitFilter !== 'all') {
                items = items.filter(i => i.kit === window.appState.selectedKitFilter);
            }

            if (items.length === 0) {
                body.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-400 text-xs">등록된 물품이 없습니다.</td></tr>`;
                return;
            }

            body.innerHTML = items.map(item => {
                const isLow = item.count <= item.minCount;
                return `
                    <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition">
                        <td class="px-4 py-3 font-medium text-xs text-slate-500 dark:text-slate-400">
                            <span class="px-2 py-0.5 rounded-md ${item.kit === '포터블 구급가방' ? 'bg-amber-50 text-amber-700 dark:bg-amber-950 dark:text-amber-300' : 'bg-rose-50 text-rose-700 dark:bg-rose-950 dark:text-rose-300'} font-semibold">
                                ${escapeHtml(item.kit || '공통')}
                            </span>
                        </td>
                        <td class="px-4 py-3 font-semibold text-slate-900 dark:text-white">${escapeHtml(item.name)}</td>
                        <td class="px-4 py-3 text-slate-500 dark:text-slate-400">${escapeHtml(item.category)}</td>
                        <td class="px-4 py-3">
                            <div class="flex items-center gap-2">
                                <input type="number" value="${item.count}" onchange="directUpdateInventoryCount('${item.id}', this.value)" class="w-20 p-1.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg font-bold ${isLow ? 'text-rose-600' : 'text-slate-800 dark:text-slate-200'}">
                                <span class="text-xs text-slate-500">${item.unit || ''}</span>
                                ${isLow ? `<span class="text-[10px] bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300 px-1.5 py-0.5 rounded-full font-semibold">부족</span>` : ''}
                            </div>
                        </td>
                        <td class="px-4 py-3 text-right space-x-1">
                            <button onclick="updateInventoryCount('${item.id}', -1)" class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition font-bold" title="수량 1 감소">-1</button>
                            <button onclick="updateInventoryCount('${item.id}', 1)" class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition font-bold" title="수량 1 증가">+1</button>
                            <button onclick="deleteInventoryItem('${item.id}')" class="w-7 h-7 rounded-lg bg-rose-50 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400 hover:bg-rose-100 transition inline-flex items-center justify-center ml-1" title="물품 삭제"><i class="fa-regular fa-trash-can text-xs"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function setKitFilter(kitName) {
            window.appState.selectedKitFilter = kitName;
            document.querySelectorAll('.kit-filter-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'dark:bg-slate-900', 'shadow-xs', 'text-slate-900', 'dark:text-white', 'font-semibold');
                btn.classList.add('text-slate-600', 'dark:text-slate-400', 'font-medium');
            });
            if (event && event.target) {
                event.target.classList.add('bg-white', 'dark:bg-slate-900', 'shadow-xs', 'text-slate-900', 'dark:text-white', 'font-semibold');
                event.target.classList.remove('text-slate-600', 'dark:text-slate-400');
            }
            renderInventory();
        }

        function getCategoryBadge(cat) {
            switch(cat) {
                case '외상': return 'bg-rose-50 text-rose-700 dark:bg-rose-950 dark:text-rose-300';
                case '내상': return 'bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300';
                default: return 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function switchTab(tabId) {
            window.appState.currentTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'dark:bg-slate-800', 'shadow-sm', 'text-slate-900', 'dark:text-white', 'font-semibold');
                btn.classList.add('text-slate-500', 'font-medium');
            });
            const activeBtn = document.getElementById(`tab-${tabId}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-white', 'dark:bg-slate-800', 'shadow-sm', 'text-slate-900', 'dark:text-white', 'font-semibold');
                activeBtn.classList.remove('text-slate-500', 'font-medium');
            }
            document.querySelectorAll('.tab-content').forEach(view => view.classList.add('hidden'));
            const viewTarget = document.getElementById(`view-${tabId}`);
            if (viewTarget) viewTarget.classList.remove('hidden');
        }

        function handleSearch(val) { window.appState.searchQuery = val; renderRecords(); }
        function searchStudent(name) { 
            const searchInput = document.getElementById('search-input');
            if (searchInput) searchInput.value = name; 
            window.appState.searchQuery = name; 
            switchTab('logs'); 
            renderRecords(); 
        }
        function clearSearchFilter() { 
            const searchInput = document.getElementById('search-input');
            if (searchInput) searchInput.value = ''; 
            window.appState.searchQuery = ''; 
            renderRecords(); 
        }

        function setCategoryFilter(cat) {
            window.appState.filterCategory = cat;
            document.querySelectorAll('.cat-filter-btn').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'dark:bg-white', 'text-white', 'dark:text-slate-900', 'font-semibold');
                btn.classList.add('text-slate-600', 'dark:text-slate-300', 'font-medium');
            });
            if (event && event.target) {
                event.target.classList.add('bg-slate-900', 'dark:bg-white', 'text-white', 'dark:text-slate-900', 'font-semibold');
                event.target.classList.remove('text-slate-600', 'dark:text-slate-300');
            }
            renderRecords();
        }

        function toggleVitalInput(type) {
            const checkbox = document.getElementById(`check-${type}`);
            if (!checkbox) return;
            const isChecked = checkbox.checked;
            const box = document.getElementById(`box-${type}`);
            const container = document.getElementById('vitals-inputs');
            
            if (isChecked) {
                if (container) container.classList.remove('hidden');
                if (box) box.classList.remove('hidden');
            } else {
                if (box) box.classList.add('hidden');
                const inputVal = document.getElementById(`input-${type}`);
                if (inputVal) inputVal.value = '';
                const anyChecked = ['temp', 'bp', 'spo2', 'hr'].some(t => {
                    const cb = document.getElementById(`check-${t}`);
                    return cb && cb.checked;
                });
                if (!anyChecked && container) container.classList.add('hidden');
            }
        }

        function openNewRecordModal() {
            const form = document.getElementById('record-form');
            if (form) form.reset();
            const vitalsInput = document.getElementById('vitals-inputs');
            if (vitalsInput) vitalsInput.classList.add('hidden');
            ['temp', 'bp', 'spo2', 'hr'].forEach(t => {
                const b = document.getElementById(`box-${t}`);
                if (b) b.classList.add('hidden');
            });
            const modal = document.getElementById('modal-record');
            if (modal) modal.classList.remove('hidden');
        }
        function closeRecordModal() { 
            const modal = document.getElementById('modal-record');
            if (modal) modal.classList.add('hidden'); 
        }
        function openAddInventoryModal() { 
            const modal = document.getElementById('modal-inventory');
            if (modal) modal.classList.remove('hidden'); 
        }
        function closeInventoryModal() { 
            const modal = document.getElementById('modal-inventory');
            if (modal) modal.classList.add('hidden'); 
        }

        async function handleSaveRecord(e) {
            e.preventDefault();
            showLoading(true);

            const newRecord = {
                id: 'doc-' + Date.now(),
                studentName: document.getElementById('input-name').value.trim(),
                gradeClass: document.getElementById('input-class').value.trim(),
                category: document.getElementById('input-category').value,
                kit: document.getElementById('input-kit').value,
                temp: document.getElementById('check-temp').checked ? document.getElementById('input-temp').value.trim() : '',
                bp: document.getElementById('check-bp').checked ? document.getElementById('input-bp').value.trim() : '',
                spo2: document.getElementById('check-spo2').checked ? document.getElementById('input-spo2').value.trim() : '',
                hr: document.getElementById('check-hr').checked ? document.getElementById('input-hr').value.trim() : '',
                symptom: document.getElementById('input-symptom').value.trim(),
                treatment: document.getElementById('input-treatment').value.trim(),
                timestamp: new Date().toISOString()
            };

            if (window.appState.user && window.appState.db) {
                try {
                    const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                    const docRef = doc(window.appState.db, 'artifacts', window.appState.appId, 'users', window.appState.user.uid, 'health_logs', newRecord.id);
                    await setDoc(docRef, newRecord);
                    showToast('새로운 차트가 저장되었습니다.', 'success');
                } catch (err) {
                    console.error(err);
                    showToast('서버 저장 실패: 보안 규칙을 확인하세요.', 'error');
                }
            } else {
                window.appState.records.unshift(newRecord);
                showToast('새로운 차트가 등록되었습니다.', 'success');
            }
            showLoading(false);
            closeRecordModal();
            renderApp();
        }

        async function deleteRecord(id) {
            if (!confirm('기록을 삭제하시겠습니까?')) return;
            showLoading(true);

            if (window.appState.user && window.appState.db) {
                try {
                    const { doc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                    await deleteDoc(doc(window.appState.db, 'artifacts', window.appState.appId, 'users', window.appState.user.uid, 'health_logs', id));
                    showToast('차트가 삭제되었습니다.', 'info');
                } catch (err) {
                    console.error(err);
                    showToast('삭제 실패: Firestore 권한을 확인하세요.', 'error');
                } finally {
                    showLoading(false);
                }
            } else {
                window.appState.records = window.appState.records.filter(r => r.id !== id);
                showLoading(false);
                renderApp();
                showToast('차트가 삭제되었습니다.', 'info');
            }
        }

        async function updateInventoryCount(id, delta) {
            const item = window.appState.inventory.find(i => i.id === id);
            if (!item) return;
            item.count = Math.max(0, item.count + delta);
            syncInventory(item);
        }

        async function directUpdateInventoryCount(id, val) {
            const item = window.appState.inventory.find(i => i.id === id);
            if (!item) return;
            item.count = Math.max(0, parseInt(val) || 0);
            syncInventory(item);
        }

        async function syncInventory(item) {
            if (window.appState.user && window.appState.db) {
                try {
                    const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                    await setDoc(doc(window.appState.db, 'artifacts', window.appState.appId, 'users', window.appState.user.uid, 'inventory', item.id), item);
                    showToast('수량이 수정되었습니다.', 'success');
                } catch (err) {
                    console.error(err);
                    showToast('저장 실패: Firestore 권한 문제', 'error');
                }
            }
            renderApp();
        }

        async function deleteInventoryItem(id) {
            if (!confirm('해당 물품을 재고 목록에서 완전히 삭제하시겠습니까?')) return;
            showLoading(true);

            if (window.appState.user && window.appState.db) {
                try {
                    const { doc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                    await deleteDoc(doc(window.appState.db, 'artifacts', window.appState.appId, 'users', window.appState.user.uid, 'inventory', id));
                    showToast('물품이 DB에서 완전히 삭제되었습니다.', 'info');
                } catch (err) {
                    console.error(err);
                    showToast('물품 삭제 실패: Firestore 권한 문제', 'error');
                } finally {
                    showLoading(false);
                }
            } else {
                window.appState.inventory = window.appState.inventory.filter(i => i.id !== id);
                showLoading(false);
                renderApp();
                showToast('물품이 삭제되었습니다.', 'info');
            }
        }

        async function saveInventoryItem() {
            const kit = document.getElementById('inv-kit').value;
            const name = document.getElementById('inv-name').value.trim();
            const category = document.getElementById('inv-cat').value.trim() || '소모품';
            const count = parseInt(document.getElementById('inv-count').value) || 10;
            const unit = document.getElementById('inv-unit').value;
            if (!name) return;

            showLoading(true);
            const newItem = { id: 'inv-' + Date.now(), kit, name, category, count, minCount: 5, unit };
            
            if (window.appState.user && window.appState.db) {
                try {
                    const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                    await setDoc(doc(window.appState.db, 'artifacts', window.appState.appId, 'users', window.appState.user.uid, 'inventory', newItem.id), newItem);
                    showToast('새 물품이 추가되었습니다.', 'success');
                } catch (err) {
                    console.error(err);
                    showToast('추가 실패: Firestore 권한 문제', 'error');
                }
            } else {
                window.appState.inventory.push(newItem);
                showToast('새 물품이 등록되었습니다.', 'success');
            }
            showLoading(false);
            closeInventoryModal();
            renderApp();
        }

        function toggleDarkMode() {
            window.appState.isDarkMode = !window.appState.isDarkMode;
            const darkIcon = document.getElementById('dark-icon');
            if (window.appState.isDarkMode) {
                document.documentElement.classList.add('dark');
                if (darkIcon) darkIcon.className = 'fa-solid fa-sun text-base text-amber-400';
            } else {
                document.documentElement.classList.remove('dark');
                if (darkIcon) darkIcon.className = 'fa-solid fa-moon text-base';
            }
        }
    </script>
</body>
</html>
