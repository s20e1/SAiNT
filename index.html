<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-200">

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.appState = {
            user: null,
            db: null,
            auth: null,
            appId: typeof __app_id !== 'undefined' ? __app_id : 'school-health-log-v2',
            records: [],
            inventory: [],
            currentTab: 'logs',
            searchQuery: '',
            filterCategory: 'all',
            isDarkMode: false
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-api-key",
            authDomain: "demo-app.firebaseapp.com",
            projectId: "demo-app",
            storageBucket: "demo-app.appspot.com",
            messagingSenderId: "000000000000",
            appId: "1:000000000000:web:000000000000"
        };

        try {
            const app = initializeApp(firebaseConfig);
            window.appState.auth = getAuth(app);
            window.appState.db = getFirestore(app);

            onAuthStateChanged(window.appState.auth, (user) => {
                if (user) {
                    window.appState.user = user;
                    document.getElementById('user-status').innerText = `접속 완료`;
                    document.getElementById('login-modal').classList.add('hidden');
                    initDataListeners();
                } else {
                    window.appState.user = null;
                    document.getElementById('login-modal').classList.remove('hidden');
                }
            });
        } catch (e) {
            console.error("Firebase fallback to local mode:", e);
            document.getElementById('login-modal').classList.add('hidden');
            loadEmptyData();
        }

        window.guestLogin = async () => {
            try {
                if (window.appState.auth) {
                    await signInAnonymously(window.appState.auth);
                } else {
                    document.getElementById('login-modal').classList.add('hidden');
                    loadEmptyData();
                }
            } catch (err) {
                document.getElementById('login-modal').classList.add('hidden');
                loadEmptyData();
            }
        };

        function initDataListeners() {
            if (!window.appState.user || !window.appState.db) {
                loadEmptyData();
                return;
            }

            const uid = window.appState.user.uid;
            const appId = window.appState.appId;

            const logsRef = collection(window.appState.db, 'artifacts', appId, 'users', uid, 'health_logs');
            onSnapshot(logsRef, (snapshot) => {
                const logs = [];
                snapshot.forEach(doc => {
                    logs.push({ id: doc.id, ...doc.data() });
                });
                window.appState.records = logs.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                renderApp();
            }, (err) => {
                loadEmptyData();
            });

            const invRef = collection(window.appState.db, 'artifacts', appId, 'users', uid, 'inventory');
            onSnapshot(invRef, (snapshot) => {
                const inv = [];
                snapshot.forEach(doc => {
                    inv.push({ id: doc.id, ...doc.data() });
                });
                window.appState.inventory = inv.length ? inv : getDefaultInventory();
                renderApp();
            }, (err) => {
                if (window.appState.inventory.length === 0) window.appState.inventory = getDefaultInventory();
                renderApp();
            });
        }

        function getDefaultInventory() {
            return [
                { id: 'inv-1', name: '혼합 밴드', category: '드레싱', count: 30, minCount: 10, unit: '개' },
                { id: 'inv-2', name: '소독용 포비돈', category: '소독액', count: 5, minCount: 2, unit: '통' },
                { id: 'inv-3', name: '멸균 가제', category: '드레싱', count: 40, minCount: 15, unit: '팩' }
            ];
        }

        function loadEmptyData() {
            window.appState.records = [];
            window.appState.inventory = getDefaultInventory();
            renderApp();
        }
    </script>

    <!-- UI Container -->
    <div id="app" class="max-w-4xl mx-auto px-4 py-6 md:px-8">

                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                <span>바로 시작하기</span>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        function renderApp() {
            renderRecords();
            renderInventory();
        }

        function renderRecords() {
            const container = document.getElementById('records-list');
            let items = [...window.appState.records];

            const query = window.appState.searchQuery.toLowerCase().trim();
            const noticeEl = document.getElementById('search-notice');
            const noticeText = document.getElementById('search-notice-text');

            if (query) {
                items = items.filter(r => r.studentName.toLowerCase().includes(query));
                noticeEl.classList.remove('hidden');
                noticeText.innerText = `"${query}" 검색 결과: 총 ${items.length}건의 누적 차트가 조회되었습니다.`;
            } else {
                noticeEl.classList.add('hidden');
            }

            if (window.appState.filterCategory !== 'all') {
                items = items.filter(r => r.category === window.appState.filterCategory);
            }

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 text-slate-400">
                        <i class="fa-solid fa-folder-open text-2xl mb-2"></i>
                        <p class="text-xs">저장된 처치 기록이 없습니다.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map(record => {
                const dateObj = new Date(record.timestamp);
                const timeStr = dateObj.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
                const dateStr = dateObj.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });

                return `
                    <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-xs transition hover:border-slate-300 dark:hover:border-slate-700">
                        <div class="flex items-start justify-between">
                            <div class="flex items-center space-x-2.5">
                                <button onclick="searchStudent('${escapeHtml(record.studentName)}')" class="font-bold text-sm text-slate-900 dark:text-white hover:underline flex items-center gap-1 group" title="클릭시 이 학생의 모든 차트 모아보기">
                                    <span>${escapeHtml(record.studentName)}</span>
                                    <i class="fa-solid fa-search text-[10px] text-slate-400 group-hover:text-slate-600"></i>
                                </button>
                                ${record.gradeClass ? `<span class="text-xs text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-md">${escapeHtml(record.gradeClass)}</span>` : ''}
                                <span class="text-xs px-2 py-0.5 rounded-md ${getCategoryBadge(record.category)}">${escapeHtml(record.category)}</span>
                            </div>
                            <div class="flex items-center space-x-1.5 no-print">
                                <button onclick="deleteRecord('${record.id}')" class="p-1 text-slate-400 hover:text-rose-500 transition" title="기록 삭제">
                                    <i class="fa-regular fa-trash-can"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mt-3 space-y-1 text-xs">
                            <div class="text-slate-700 dark:text-slate-300">
                                <span class="font-semibold text-slate-900 dark:text-slate-100">상처/부위:</span> ${escapeHtml(record.symptom)}
                            </div>
                            <div class="text-slate-600 dark:text-slate-400">
                                <span class="font-semibold text-slate-800 dark:text-slate-200">처치내용:</span> ${escapeHtml(record.treatment)}
                            </div>
                        </div>

                        <div class="mt-3 pt-2.5 border-t border-slate-100 dark:border-slate-800/60 flex items-center justify-between text-[11px] text-slate-400">
                            <div class="flex items-center gap-3">
                                ${record.temp ? `<span><i class="fa-solid fa-thermometer-half mr-1 text-rose-400"></i>${record.temp}℃</span>` : ''}
                                ${record.bp ? `<span><i class="fa-solid fa-heart-pulse mr-1 text-indigo-400"></i>${record.bp}</span>` : ''}
                            </div>
                            <div>
                                ${dateStr} ${timeStr}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderInventory() {
            const body = document.getElementById('inventory-table-body');
            const items = window.appState.inventory;

            body.innerHTML = items.map(item => {
                const isLow = item.count <= item.minCount;
                return `
                    <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition">
                        <td class="px-4 py-3 font-semibold text-slate-900 dark:text-white">${escapeHtml(item.name)}</td>
                        <td class="px-4 py-3 text-slate-500 dark:text-slate-400">${escapeHtml(item.category)}</td>
                        <td class="px-4 py-3">
                            <span class="font-bold ${isLow ? 'text-rose-600 dark:text-rose-400' : 'text-slate-800 dark:text-slate-200'}">
                                ${item.count} ${item.unit}
                            </span>
                            ${isLow ? `<span class="ml-2 text-[10px] bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300 px-1.5 py-0.5 rounded-full font-semibold">부족</span>` : ''}
                        </td>
                        <td class="px-4 py-3 text-right space-x-1 no-print">
                            <button onclick="updateInventoryCount('${item.id}', -1)" class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition font-bold">-</button>
                            <button onclick="updateInventoryCount('${item.id}', 1)" class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition font-bold">+</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function getCategoryBadge(cat) {
            switch(cat) {
                case '찰과상/까짐': return 'bg-rose-50 text-rose-700 dark:bg-rose-950 dark:text-rose-300';
                case '타박상/멍': return 'bg-amber-50 text-amber-700 dark:bg-amber-950 dark:text-amber-300';
                case '베인 상처': return 'bg-orange-50 text-orange-700 dark:bg-orange-950 dark:text-orange-300';
                case '염좌/삐임': return 'bg-sky-50 text-sky-700 dark:bg-sky-950 dark:text-sky-300';
                default: return 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function switchTab(tabId) {
            window.appState.currentTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'dark:bg-slate-800', 'shadow-sm', 'text-slate-900', 'dark:text-white', 'font-semibold');
                btn.classList.add('text-slate-500', 'font-medium');
            });
            const activeBtn = document.getElementById(`tab-${tabId}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-white', 'dark:bg-slate-800', 'shadow-sm', 'text-slate-900', 'dark:text-white', 'font-semibold');
                activeBtn.classList.remove('text-slate-500', 'font-medium');
            }

            document.querySelectorAll('.tab-content').forEach(view => view.classList.add('hidden'));
            document.getElementById(`view-${tabId}`).classList.remove('hidden');
        }

        function handleSearch(val) {
            window.appState.searchQuery = val;
            renderRecords();
        }

        function searchStudent(name) {
            document.getElementById('search-input').value = name;
            window.appState.searchQuery = name;
            renderRecords();
        }

        function clearSearchFilter() {
            document.getElementById('search-input').value = '';
            window.appState.searchQuery = '';
            renderRecords();
        }

        function setCategoryFilter(cat) {
            window.appState.filterCategory = cat;
            document.querySelectorAll('.cat-filter-btn').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'dark:bg-white', 'text-white', 'dark:text-slate-900', 'font-semibold');
                btn.classList.add('text-slate-600', 'dark:text-slate-300', 'font-medium');
            });
            event.target.classList.add('bg-slate-900', 'dark:bg-white', 'text-white', 'dark:text-slate-900', 'font-semibold');
            event.target.classList.remove('text-slate-600', 'dark:text-slate-300');
            renderRecords();
        }

        function toggleVitalInput(type) {
            const isChecked = document.getElementById(`check-${type}`).checked;
            const box = document.getElementById(`box-${type}`);
            const container = document.getElementById('vitals-inputs');
            
            if (isChecked) {
                container.classList.remove('hidden');
                box.classList.remove('hidden');
            } else {
                box.classList.add('hidden');
                document.getElementById(`input-${type}`).value = '';
                if(!document.getElementById('check-temp').checked && !document.getElementById('check-bp').checked) {
                    container.classList.add('hidden');
                }
            }
        }

        function openNewRecordModal() {
            document.getElementById('record-form').reset();
            document.getElementById('vitals-inputs').classList.add('hidden');
            document.getElementById('box-temp').classList.add('hidden');
            document.getElementById('box-bp').classList.add('hidden');
            document.getElementById('modal-record').classList.remove('hidden');
        }

        function closeRecordModal() {
            document.getElementById('modal-record').classList.add('hidden');
        }

        function openAddInventoryModal() {
            document.getElementById('modal-inventory').classList.remove('hidden');
        }

        function closeInventoryModal() {
            document.getElementById('modal-inventory').classList.add('hidden');
        }

        async function handleSaveRecord(e) {
            e.preventDefault();

            const tempVal = document.getElementById('check-temp').checked ? document.getElementById('input-temp').value.trim() : '';
            const bpVal = document.getElementById('check-bp').checked ? document.getElementById('input-bp').value.trim() : '';

            const newRecord = {
                id: 'doc-' + Date.now(),
                studentName: document.getElementById('input-name').value.trim(),
                gradeClass: document.getElementById('input-class').value.trim(),
                category: document.getElementById('input-category').value,
                temp: tempVal,
                bp: bpVal,
                symptom: document.getElementById('input-symptom').value.trim(),
                treatment: document.getElementById('input-treatment').value.trim(),
                timestamp: new Date().toISOString()
            };

            if (window.appState.user && window.appState.db) {
                try {
                    const docRef = doc(window.appState.db, 'artifacts', window.appState.appId, 'users', window.appState.user.uid, 'health_logs', newRecord.id);
                    await setDoc(docRef, newRecord);
                } catch (err) {
                    window.appState.records.unshift(newRecord);
                }
            } else {
                window.appState.records.unshift(newRecord);
            }

            closeRecordModal();
            renderApp();
        }

        async function deleteRecord(id) {
            if (!confirm('이 기록을 삭제하시겠습니까?')) return;
            window.appState.records = window.appState.records.filter(r => r.id !== id);

            if (window.appState.user && window.appState.db) {
                try {
                    const docRef = doc(window.appState.db, 'artifacts', window.appState.appId, 'users', window.appState.user.uid, 'health_logs', id);
                    await deleteDoc(docRef);
                } catch (err) {}
            }
            renderApp();
        }

        async function updateInventoryCount(id, delta) {
            const item = window.appState.inventory.find(i => i.id === id);
            if (!item) return;

            item.count = Math.max(0, item.count + delta);

            if (window.appState.user && window.appState.db) {
                try {
                    const docRef = doc(window.appState.db, 'artifacts', window.appState.appId, 'users', window.appState.user.uid, 'inventory', id);
                    await setDoc(docRef, item);
                } catch (err) {}
            }
            renderApp();
        }

        async function saveInventoryItem() {
            const name = document.getElementById('inv-name').value.trim();
            const category = document.getElementById('inv-cat').value.trim() || '드레싱';
            const count = parseInt(document.getElementById('inv-count').value) || 10;
            const unit = document.getElementById('inv-unit').value.trim() || '개';

            if (!name) return;

            const newItem = {
                id: 'inv-' + Date.now(),
                name,
                category,
                count,
                minCount: 5,
                unit
            };

            window.appState.inventory.push(newItem);

            if (window.appState.user && window.appState.db) {
                try {
                    const docRef = doc(window.appState.db, 'artifacts', window.appState.appId, 'users', window.appState.user.uid, 'inventory', newItem.id);
                    await setDoc(docRef, newItem);
                } catch (err) {}
            }

            closeInventoryModal();
            renderApp();
        }

        function toggleDarkMode() {
            window.appState.isDarkMode = !window.appState.isDarkMode;
            if (window.appState.isDarkMode) {
                document.documentElement.classList.add('dark');
                document.getElementById('dark-icon').className = 'fa-solid fa-sun text-base text-amber-400';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('dark-icon').className = 'fa-solid fa-moon text-base';
            }
        }
    </script>
</body>
</html>
