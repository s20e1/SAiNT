<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통합 기록 및 응급 관리 플랫폼</title>
  
  <!-- Pretendard Font & Tailwind CSS -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            toss: {
              blue: '#3182f6',
              blueHover: '#1b64da',
              lightBlue: '#e8f3ff',
              bg: '#f2f4f6',
              darkBg: '#101012',
              card: '#ffffff',
              darkCard: '#1c1c1e',
              text: '#191f28',
              subtext: '#6b7684',
              border: '#e5e8eb',
              darkBorder: '#2c2c2e',
              red: '#f04452',
              lightRed: '#feeef0'
            }
          },
          borderRadius: {
            '2xl': '18px',
            '3xl': '24px',
            '4xl': '32px'
          }
        }
      }
    };
  </script>
  <style>
    @font-face {
      font-family: 'A2Z';
      src: local('A2Z'), local('에이투지'), local('A2Z-Regular');
      font-display: swap;
    }

    :root {
      --bg-main: #f2f4f6;
      --bg-card: #ffffff;
      --border-color: rgba(0, 0, 0, 0.04);
      --text-main: #191f28;
      --text-muted: #6b7684;
    }

    .dark {
      --bg-main: #101012;
      --bg-card: #1c1c1e;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f2f4f6;
      --text-muted: #8b95a1;
    }

    body {
      font-family: 'A2Z', 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
      letter-spacing: -0.02em;
    }

    .toss-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
    }

    .toss-button {
      transition: all 0.15s ease-in-out;
    }
    .toss-button:active {
      transform: scale(0.98);
    }

    /* Side drawer transitions */
    .drawer-overlay {
      transition: opacity 0.25s ease-in-out;
    }
    .drawer-content {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Print styles */
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-toss-blue selection:text-white">

  <!-- Mandatory Auth Screen (Full Screen Overlay when Not Authenticated) -->
  <div id="auth-screen" class="fixed inset-0 z-50 bg-toss-bg dark:bg-toss-darkBg flex items-center justify-center p-4 transition-opacity duration-300">
    <div class="toss-card max-w-md w-full rounded-3xl p-8 space-y-8 shadow-xl">
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-toss-blue text-white font-bold text-2xl flex items-center justify-center mx-auto shadow-md">
          P
        </div>
        <h2 id="auth-screen-title" class="text-2xl font-bold tracking-tight text-toss-text dark:text-white pt-2">로그인이 필요합니다</h2>
        <p id="auth-screen-sub" class="text-sm text-toss-subtext dark:text-toss-subtext">서비스 이용을 위해 계정에 로그인해주세요.</p>
      </div>

      <form id="form-auth" onsubmit="handleAuthSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-toss-subtext mb-1.5 pl-1">이메일</label>
          <input type="email" id="auth-email" required placeholder="example@toss.im" class="w-full px-4 py-3.5 text-sm rounded-2xl bg-toss-bg dark:bg-[#2c2c2e] text-toss-text dark:text-white focus:outline-none focus:ring-2 focus:ring-toss-blue transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-toss-subtext mb-1.5 pl-1">비밀번호</label>
          <input type="password" id="auth-password" required placeholder="비밀번호를 입력하세요" class="w-full px-4 py-3.5 text-sm rounded-2xl bg-toss-bg dark:bg-[#2c2c2e] text-toss-text dark:text-white focus:outline-none focus:ring-2 focus:ring-toss-blue transition">
        </div>

        <button type="submit" id="btn-auth-submit" class="toss-button w-full py-4 text-base font-bold rounded-2xl bg-toss-blue text-white hover:bg-toss-blueHover transition shadow-sm mt-2">
          로그인하기
        </button>
      </form>

      <div class="flex items-center justify-between text-xs text-toss-subtext pt-2 px-1">
        <button onclick="toggleAuthMode()" id="btn-auth-toggle" class="font-semibold text-toss-blue hover:underline">
          신규 회원가입
        </button>
        <button onclick="handlePasswordReset()" class="hover:underline">
          비밀번호 재설정
        </button>
      </div>
    </div>
  </div>

  <!-- Main Authenticated App Container -->
  <div id="main-app" class="min-h-screen flex flex-col hidden">

    <!-- Top Application Header -->
    <header class="sticky top-0 z-40 w-full toss-card border-b backdrop-blur-md bg-opacity-80 dark:bg-opacity-80 transition-colors">
      <div class="max-w-5xl mx-auto px-5 h-16 flex items-center justify-between gap-4">
        
        <!-- Brand Logo & Title -->
        <div class="flex items-center gap-3">
          <div onclick="switchView('dashboard')" class="cursor-pointer flex items-center gap-2.5 group">
            <div class="w-8 h-8 rounded-xl bg-toss-blue flex items-center justify-center text-white font-bold text-base shadow-sm">
              P
            </div>
            <span class="font-bold text-lg tracking-tight">기록 플랫폼</span>
          </div>

          <span id="current-mode-badge" class="px-3 py-1 text-xs font-semibold rounded-full bg-toss-lightBlue text-toss-blue border border-toss-blue/10">
            학습 정리 모드
          </span>
        </div>

        <!-- Action Controls -->
        <div class="flex items-center gap-2">
          <!-- Service Mode Toggle -->
          <button onclick="toggleServiceMode()" class="toss-button px-3.5 py-2 text-xs font-bold rounded-xl bg-toss-bg dark:bg-toss-darkCard text-toss-text dark:text-white hover:bg-toss-border/60 transition flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-toss-subtext" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
            <span class="hidden sm:inline">모드 전환</span>
          </button>

          <!-- Dark/Light Theme -->
          <button onclick="toggleDarkMode()" class="toss-button p-2.5 rounded-xl bg-toss-bg dark:bg-toss-darkCard hover:bg-toss-border/60 transition text-toss-text dark:text-white" title="테마 변경">
            <svg id="theme-icon-sun" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg id="theme-icon-moon" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>

          <!-- Navigation Menu Trigger -->
          <button onclick="toggleDrawer(true)" class="toss-button p-2.5 rounded-xl bg-toss-bg dark:bg-toss-darkCard hover:bg-toss-border/60 transition">
            <svg class="w-5 h-5 text-toss-text dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
        </div>

      </div>
    </header>

    <!-- Side Navigation Drawer -->
    <div id="drawer-overlay" class="drawer-overlay fixed inset-0 z-50 bg-black/40 backdrop-blur-xs opacity-0 pointer-events-none transition-opacity" onclick="toggleDrawer(false)"></div>
    
    <aside id="nav-drawer" class="drawer-content fixed top-0 right-0 z-50 w-80 h-full toss-card border-l shadow-2xl translate-x-full flex flex-col transition-transform duration-300">
      <div class="p-6 border-b border-toss-border dark:border-toss-darkBorder flex items-center justify-between">
        <span class="font-bold text-lg">메뉴</span>
        <button onclick="toggleDrawer(false)" class="p-1.5 rounded-xl text-toss-subtext hover:bg-toss-bg dark:hover:bg-toss-darkBg transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="p-5 flex-1 overflow-y-auto space-y-6">
        
        <!-- User Account Card -->
        <div class="p-4 rounded-2xl bg-toss-bg dark:bg-toss-darkBg border border-toss-border dark:border-toss-darkBorder space-y-1">
          <div class="text-xs font-semibold text-toss-subtext">로그인된 계정</div>
          <div id="drawer-user-email" class="font-bold text-sm truncate text-toss-text dark:text-white">사용자 계정</div>
          <div id="drawer-user-id" class="text-xs text-toss-subtext truncate font-mono pt-0.5">ID: -</div>
        </div>

        <!-- Navigation Links -->
        <div id="nav-group-study" class="space-y-1">
          <div class="px-2 text-xs font-bold text-toss-subtext uppercase tracking-wider mb-2">학습 메뉴</div>
          <button onclick="switchView('dashboard')" class="w-full text-left px-3.5 py-3 rounded-2xl font-semibold text-sm hover:bg-toss-bg dark:hover:bg-toss-darkBg transition flex items-center justify-between">
            <span>기록 목록</span>
            <span class="text-xs px-2.5 py-0.5 rounded-full bg-toss-lightBlue text-toss-blue font-bold">메인</span>
          </button>
          <button onclick="openWritePane('학습')" class="w-full text-left px-3.5 py-3 rounded-2xl font-semibold text-sm hover:bg-toss-bg dark:hover:bg-toss-darkBg transition">
            새 학습 노트 작성
          </button>
          <button onclick="switchView('templates')" class="w-full text-left px-3.5 py-3 rounded-2xl font-semibold text-sm hover:bg-toss-bg dark:hover:bg-toss-darkBg transition">
            작성 템플릿
          </button>
        </div>

        <div id="nav-group-emr" class="space-y-1 hidden">
          <div class="px-2 text-xs font-bold text-toss-subtext uppercase tracking-wider mb-2">보건/응급 메뉴</div>
          <button onclick="switchView('dashboard')" class="w-full text-left px-3.5 py-3 rounded-2xl font-semibold text-sm hover:bg-toss-bg dark:hover:bg-toss-darkBg transition flex items-center justify-between">
            <span>응급 기록 목록</span>
            <span class="text-xs px-2.5 py-0.5 rounded-full bg-toss-lightRed text-toss-red font-bold">메인</span>
          </button>
          <button onclick="openWritePane('응급')" class="w-full text-left px-3.5 py-3 rounded-2xl font-semibold text-sm hover:bg-toss-bg dark:hover:bg-toss-darkBg transition">
            새 응급 기록 작성
          </button>
          <button onclick="switchView('ice')" class="w-full text-left px-3.5 py-3 rounded-2xl font-semibold text-sm hover:bg-toss-bg dark:hover:bg-toss-darkBg transition">
            응급 참고 프로필 설정
          </button>
        </div>

        <div class="space-y-1 pt-4 border-t border-toss-border dark:border-toss-darkBorder">
          <div class="px-2 text-xs font-bold text-toss-subtext uppercase tracking-wider mb-2">유틸리티</div>
          <button onclick="switchView('supplies')" class="w-full text-left px-3.5 py-3 rounded-2xl font-semibold text-sm hover:bg-toss-bg dark:hover:bg-toss-darkBg transition">
            물품 수급 관리
          </button>
          <button onclick="switchView('stats')" class="w-full text-left px-3.5 py-3 rounded-2xl font-semibold text-sm hover:bg-toss-bg dark:hover:bg-toss-darkBg transition">
            통계 및 분석
          </button>
          <button onclick="switchView('csv')" class="w-full text-left px-3.5 py-3 rounded-2xl font-semibold text-sm hover:bg-toss-bg dark:hover:bg-toss-darkBg transition">
            CSV 대량 연동
          </button>
          <button onclick="triggerPrintReport()" class="w-full text-left px-3.5 py-3 rounded-2xl font-semibold text-sm hover:bg-toss-bg dark:hover:bg-toss-darkBg transition">
            보고서 인쇄
          </button>
        </div>

      </div>

      <!-- Drawer Logout -->
      <div class="p-5 border-t border-toss-border dark:border-toss-darkBorder">
        <button onclick="handleLogout()" class="toss-button w-full py-3.5 px-4 rounded-2xl bg-toss-lightRed hover:bg-red-100 dark:bg-toss-red/10 text-toss-red font-bold text-sm transition">
          로그아웃
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-8">

      <!-- Top Search & Toolbar -->
      <section id="global-toolbar" class="mb-6 toss-card p-4 rounded-3xl space-y-3 sm:space-y-0 sm:flex sm:items-center sm:justify-between sm:gap-3">
        <div class="flex-1 flex flex-col sm:flex-row items-center gap-2.5">
          
          <!-- Search Box -->
          <div class="relative w-full sm:w-72">
            <input type="text" id="input-search" oninput="handleSearchFilter()" placeholder="검색어를 입력하세요" class="w-full pl-10 pr-4 py-3 text-sm rounded-2xl bg-toss-bg dark:bg-toss-darkBg text-toss-text dark:text-white border-none focus:outline-none focus:ring-2 focus:ring-toss-blue transition">
            <svg class="w-4 h-4 text-toss-subtext absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </div>

          <!-- Category Select -->
          <select id="select-category-filter" onchange="handleSearchFilter()" class="w-full sm:w-44 px-4 py-3 text-sm rounded-2xl bg-toss-bg dark:bg-toss-darkBg text-toss-text dark:text-white border-none focus:outline-none focus:ring-2 focus:ring-toss-blue transition">
            <option value="ALL">전체 카테고리</option>
            <option value="학습 노트">학습 노트</option>
            <option value="응급 및 보건">응급 및 보건</option>
            <option value="일반 메모">일반 메모</option>
          </select>

          <!-- Favorites Toggle -->
          <button id="btn-toggle-favorites" onclick="toggleFavoritesFilter()" class="toss-button w-full sm:w-auto px-4 py-3 text-sm font-semibold rounded-2xl bg-toss-bg dark:bg-toss-darkBg hover:bg-toss-border/60 transition flex items-center justify-center gap-1.5">
            <span id="fav-filter-text">고정 항목만 보기</span>
          </button>

        </div>

        <!-- Create Button -->
        <button onclick="openWritePane()" class="toss-button w-full sm:w-auto px-5 py-3 text-sm font-bold rounded-2xl bg-toss-blue text-white hover:bg-toss-blueHover transition shadow-sm flex items-center justify-center gap-1">
          <span>+ 새 기록 작성</span>
        </button>
      </section>

      <!-- VIEW 1: Dashboard -->
      <section id="pane-dashboard" class="view-pane space-y-6">
        
        <!-- Summary Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="toss-card p-6 rounded-3xl flex items-center justify-between">
            <div>
              <div class="text-xs font-bold text-toss-subtext">전체 기록</div>
              <div id="stat-total-count" class="text-3xl font-extrabold tracking-tight mt-1">0</div>
            </div>
            <div class="w-12 h-12 rounded-2xl bg-toss-lightBlue text-toss-blue font-bold flex items-center justify-center text-sm">건</div>
          </div>

          <div class="toss-card p-6 rounded-
