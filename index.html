<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-200">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Global Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-950/40 backdrop-blur-xs z-50 flex items-center justify-center hidden">
        <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-xl flex items-center space-x-3 border border-slate-200 dark:border-slate-800">
            <div class="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
            <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">처리 중입니다...</span>
        </div>
    </div>

    <!-- Firebase SDK Imports & Configuration Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc, 
            onSnapshot, 
            deleteDoc, 
            query 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.appState = {
            user: null,
            db: null,
            auth: null,
            appId: 'saint-health-saints021011',
            records: [],
            inventory: [],
            currentTab: 'logs',
            searchQuery: '',
            filterCategory: 'all',
            selectedKitFilter: 'all',
            isDarkMode: false
        };

        const firebaseConfig = {
            apiKey: "AIzaSyDeRYQvFTL4l0KciQ1znIxO6dKPLdsdzpU",
            authDomain: "saints021011.firebaseapp.com",
            projectId: "saints021011",
            storageBucket: "saints021011.firebasestorage.app",
            messagingSenderId: "900966825477",
            appId: "1:900966825477:web:0d5878d6f78318e1b2a66c",
            measurementId: "G-RD9MVZSKKH"
        };

        try {
            const app = initializeApp(firebaseConfig);
            window.appState.auth = getAuth(app);
            window.appState.db = getFirestore(app);

            onAuthStateChanged(window.appState.auth, (user) => {
                if (user) {
                    window.appState.user = user;
                    const displayElem = document.getElementById('user-email-display');
                    if (displayElem) displayElem.innerText = user.email || user.displayName || '구글 로그인 사용자';
                    const loginModal = document.getElementById('login-modal');
                    if (loginModal) loginModal.classList.add('hidden');
                    initDataListeners();
                } else {
                    window.appState.user = null;
                    const loginModal = document.getElementById('login-modal');
                    if (loginModal) loginModal.classList.remove('hidden');
                }
            });
        } catch (e) {
            console.warn("Firebase 연결 오류 또는 폴백 모드 활성화:", e);
            const loginModal = document.getElementById('login-modal');
            if (loginModal) loginModal.classList.remove('hidden');
        }

        // Auth Actions
        window.handleLoginSubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const titleText = document.getElementById('auth-mode-title').innerText;
            const isSignUp = titleText.includes('회원가입');

            showLoading(true);
            try {
                if (window.appState.auth) {
                    if (isSignUp) {
                        await createUserWithEmailAndPassword(window.appState.auth, email, password);
                        showToast('성공적으로 회원가입 및 등록되었습니다.', 'success');
                    } else {
                        await signInWithEmailAndPassword(window.appState.auth, email, password);
                        showToast('성공적으로 로그인되었습니다.', 'success');
                    }
                } else {
                    window.appState.user = { uid: 'local-user', email };
                    document.getElementById('user-email-display').innerText = email;
                    document.getElementById('login-modal').classList.add('hidden');
                    loadEmptyData();
                    showToast('로컬 모드로 로그인되었습니다.', 'success');
                }
            } catch (err) {
                showToast("인증 오류: " + err.message, 'error');
            } finally {
                showLoading(false);
            }
        };

        window.handleGoogleLogin = async () => {
            showLoading(true);
            try {
                if (window.appState.auth) {
                    const provider = new GoogleAuthProvider();
                    await signInWithPopup(window.appState.auth, provider);
                    showToast('구글 계정으로 로그인되었습니다.', 'success');
                } else {
                    window.appState.user = { uid: 'google-mock', email: 'google.user@gmail.com' };
                    document.getElementById('user-email-display').innerText = '구글 로그인 사용자';
                    document.getElementById('login-modal').classList.add('hidden');
                    loadEmptyData();
                    showToast('구글 계정으로 로그인되었습니다.', 'success');
                }
            } catch (err) {
                showToast("구글 로그인 실패: " + err.message, 'error');
            } finally {
                showLoading(false);
            }
        };

        window.toggleAuthMode = () => {
            const title = document.getElementById('auth-mode-title');
            const btn = document.getElementById('auth-submit-btn');
            const switchText = document.getElementById('auth-switch-text');
            if (title.innerText.includes('로그인')) {
                title.innerText = 'SAiNT 회원가입';
                btn.innerText = '가입하고 시작하기';
                switchText.innerHTML = '이미 계정이 있으신가요? <button type="button" onclick="toggleAuthMode()" class="underline font-semibold text-slate-900 dark:text-white">로그인</button>';
            } else {
                title.innerText = 'SAiNT 로그인';
                btn.innerText = '로그인';
                switchText.innerHTML = '계정이 없으신가요? <button type="button" onclick="toggleAuthMode()" class="underline font-semibold text-slate-900 dark:text-white">회원가입</button>';
            }
        };

        window.handleLogout = async () => {
            if (window.appState.auth) {
                await signOut(window.appState.auth);
            }
            window.appState.user = null;
            document.getElementById('login-modal').classList.remove('hidden');
            showToast('로그아웃되었습니다.', 'info');
        };

        function initDataListeners() {
            if
